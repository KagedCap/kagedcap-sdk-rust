[package]
name = "kagedcap"
version = "0.1.0"
edition = "2021"
description = "Official KagedCap Rust SDK — solve reCAPTCHA v3 tokens."
license = "MIT"
repository = "https://github.com/kagedcap/kagedcap-sdk-rust"
keywords = ["kagedcap", "recaptcha", "captcha", "solver"]
categories = ["api-bindings"]

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
